spring:
  application:
    name: hospital-management-system

  datasource:
    url: jdbc:postgresql://localhost:5432/hospital_db
    username: postgres
    password: Admin#123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
